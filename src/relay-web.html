<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ESP32 8-Relay Controller</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
body {
  font-family: Arial;
  background: #f2f2f2;
  text-align: center;
}

.container {
  background: #fff;
  display: inline-block;
  padding: 25px;
  margin-top: 20px;
  border-radius: 12px;
  box-shadow: 0 0 15px rgba(0,0,0,0.2);
}

.relay {
  margin: 10px;
  padding: 10px;
  display: inline-block;
  width: 200px;
}

button {
  width: 80px;
  padding: 10px;
  margin: 5px;
  border-radius: 6px;
  border: none;
  font-size: 15px;
  color: #fff;
  cursor: pointer;
}

.on { background: #28a745; }
.off { background: #dc3545; }

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.status {
  font-weight: bold;
  margin-top: 5px;
}

#conn {
  margin-bottom: 15px;
  padding: 10px;
  font-weight: bold;
  border-radius: 6px;
}

.online { background: #d4edda; color: #155724; }
.offline { background: #f8d7da; color: #721c24; }
</style>
</head>

<body>
<div class="container">
  <h2>🔌 ESP32 Relay Dashboard</h2>
  <div id="conn">Connecting...</div>
  <div id="relays"></div>
</div>

<script>
const BROKER_IP = "192.168.10.41";   // CHANGE if needed
const WS_PORT = 9001;

const TOPIC_STATUS  = "dev/status";
const TOPIC_COMMAND = "dev/command";
const TOPIC_ONLINE  = "dev/online";

let deviceOnline = false;

const client = mqtt.connect(`ws://${BROKER_IP}:${WS_PORT}`);

const relaysDiv = document.getElementById("relays");

// create relay cards
for (let i = 1; i <= 8; i++) {
  const d = document.createElement("div");
  d.className = "relay";
  d.innerHTML = `
    <h4>Relay ${i}</h4>
    <button class="on" onclick="sendCmd(${i},'on')">ON</button>
    <button class="off" onclick="sendCmd(${i},'off')">OFF</button>
    <div class="status" id="st${i}">UNKNOWN</div>
  `;
  relaysDiv.appendChild(d);
}

client.on("connect", () => {
  document.getElementById("conn").innerText = "🟡 Broker Connected";
  client.subscribe([TOPIC_STATUS, TOPIC_COMMAND, TOPIC_ONLINE]);
});

client.on("message", (topic, msg) => {

  if (topic === TOPIC_ONLINE) {
    deviceOnline = msg.toString() === "online";
    updateConnectionUI();
  }

  if (topic === TOPIC_STATUS) {
    const states = JSON.parse(msg.toString());
    for (let i = 1; i <= 8; i++) {
      const el = document.getElementById(`st${i}`);
      if (states[i]) {
        el.innerText = states[i].toUpperCase();
        el.style.color = states[i] === "on" ? "green" : "red";
      }
    }
  }
});

client.on("close", () => {
  deviceOnline = false;
  updateConnectionUI();
});

function updateConnectionUI() {
  const c = document.getElementById("conn");

  if (deviceOnline) {
    c.innerText = "✅ Device ONLINE";
    c.className = "online";
    enableButtons(true);
  } else {
    c.innerText = "🔴 Device OFFLINE (commands queued)";
    c.className = "offline";
    enableButtons(false);
  }
}

function enableButtons(enable) {
  document.querySelectorAll("button").forEach(b => b.disabled = !enable);
}

function sendCmd(relay, state) {
  const cmd = relay + state;

  client.publish(TOPIC_COMMAND, cmd, { retain: true });

  const el = document.getElementById(`st${relay}`);
  el.innerText = state.toUpperCase() + " (PENDING)";
  el.style.color = "orange";
}
</script>
</body>
</html>
